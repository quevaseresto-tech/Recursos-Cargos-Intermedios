<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Formularios</title>
<style>
  :root{
    --ink:#1C2B24;
    --ink-soft:#57685F;
    --bg:#F5F8F6;
    --card:#FFFFFF;
    --line:#DCE6DF;
    --accent:#1F6B3A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:32px 20px;
  }
  .wrap{width:100%;max-width:480px;display:flex;flex-direction:column;justify-content:center;}
  h1{font-size:26px;line-height:1.2;margin:0 0 8px;letter-spacing:-0.01em;}
  p.lede{font-size:15.5px;line-height:1.5;color:var(--ink-soft);margin:0 0 26px;}
  a.btn{
    display:block;
    text-decoration:none;
    color:var(--ink);
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:20px 20px;
    margin-bottom:14px;
  }
  a.btn:active{background:#EFF3F1;}
  .btn-title{font-size:18px;font-weight:700;color:var(--accent);margin-bottom:4px;}
  .btn-desc{font-size:14px;line-height:1.45;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap">
